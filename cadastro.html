<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Folha de Pagamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Bem-vindo ao Sistema</h1>
        <p>Crie sua conta para acessar</p>
    </header>
    <main>
        <section class="formulario-secao">
            <h2>Criar Conta de Acesso</h2>
            <form id="form-cadastro" class="formulario-pagamento">
                <fieldset>
                    <legend>Dados de Acesso</legend>
                    <div class="campo-grupo">
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="campo-grupo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="campo-grupo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required minlength="8">
                    </div>
                    <div class="campo-grupo">
                        <label for="confirmar-senha">Confirmar Senha:</label>
                        <input type="password" id="confirmar-senha" name="confirmar-senha" required minlength="8">
                    </div>
                </fieldset>
                <button type="submit" class="btn-principal">Cadastrar e Acessar</button>
            </form>
        </section>
    </main>
    <footer><p>&copy; 2025 Sistema de Folha de Pagamento</p></footer>
    <script src="script.js"></script>
</body>
</html>
